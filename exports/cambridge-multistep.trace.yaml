# Draft example for the Broker-Dealer audience page. Not executed against Cambridge.
# Select the Cambridge homepage environment when importing.
# This covers page identity and navigation, not every CAM-001/CAM-002 outcome.
schema: trace/test/v2
name: Cambridge — Broker-Dealer page journey
policy: read-only
checks:
  - kind: journey
    name: Open the Broker-Dealer audience page
    acceptance: The audience page opens at the expected URL and identifies Broker-Dealer.
    preconditions:
      - Public signed-out browser; no contact submissions.
    actions:
      - action: navigate
        url: /whats-your-journey/broker-dealer/
      - action: assertUrl
        value: /whats-your-journey/broker-dealer/
      - action: assertText
        target:
          selector: body
        value: Broker-Dealer
